<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e63950"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <rect x="20" y="20" width="360" height="360" fill="none" stroke="url(#accent)" stroke-width="2" rx="8"/>
  <text x="200" y="210" font-family="Arial Black, sans-serif" font-size="48" font-weight="bold" fill="url(#accent)" text-anchor="middle">DRIFT</text>
  <text x="200" y="260" font-family="Arial, sans-serif" font-size="24" fill="#b8b8c0" text-anchor="middle">SURVIVORS</text>
</svg>
